<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student panel — Karton predmeta</title>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#f2f2f2; }
        .header-container { width:100%; border:2px solid black; background:white; }
        .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; }
        .blue-section { background:#d6e4ff; text-align:center; padding:15px; font-size:22px; font-weight:bold; border-top:1px solid black; }
        .content { padding:40px; max-width:800px; margin:0 auto; background:white; text-align:center; }
        .logout { background:#d63b3b; color:white; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; text-decoration:none; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="topbar">
            <strong>Student panel</strong>
            <a href="/logout" class="logout">Odjava</a>
        </div>
        <div class="blue-section">KARTON PREDMETA</div>
    </div>

    <div class="content">
        <h1>Dobrodošao, studente!</h1>
        <p>Ovo je studentski deo aplikacije. Ovde ćeš imati pregled predmeta.</p>
    </div>
</body>
</html>
