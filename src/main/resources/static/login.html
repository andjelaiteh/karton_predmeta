<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prijava — Karton predmeta</title>
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#f2f2f2; display:flex; justify-content:center; align-items:center; height:100vh; }
        .login-box { background:#fff; padding:40px; border:2px solid black; border-radius:8px; width:320px; }
        .login-box h2 { text-align:center; margin:0 0 6px; }
        .login-box .sub { text-align:center; font-size:13px; color:#666; margin-bottom:20px; }
        .login-box input { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; }
        .login-box button { width:100%; padding:10px; background:#0047B3; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
        .login-box button:hover { background:#003a91; }
        .error { color:#d63b3b; text-align:center; margin-top:12px; font-size:14px; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Prijava</h2>
        <div class="sub">Karton predmeta</div>
        <form action="/login" method="post">
            <label for="username" class="sr-only">Korisničko ime</label>
            <input type="text" id="username" name="username" placeholder="Korisničko ime" required autofocus>
            <label for="password" class="sr-only">Lozinka</label>
            <input type="password" id="password" name="password" placeholder="Lozinka" required>
            <button type="submit">Prijavi se</button>
        </form>
        <div id="error" class="error"></div>
        <div style="text-align:center; margin-top:16px; font-size:13px;">
            Nemaš nalog? <a href="/register.html" style="color:#0047B3; text-decoration:none; font-weight:bold;">Registruj se</a>
        </div>
    </div>
    <script>
        if (window.location.search.includes("error")) {
            document.getElementById("error").innerText = "Pogrešno korisničko ime ili lozinka.";
        }
    </script>
</body>
</html>
